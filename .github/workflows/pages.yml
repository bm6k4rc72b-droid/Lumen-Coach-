name: Deploy PWA to GitHub Pages

# Publishes the app to GitHub Pages so it can be installed to a phone's home
# screen, and self-hosts the pose model so the published app makes no
# third-party requests.
#
# Before this can run, Pages must be available and enabled:
#   1. The repository must be public, or on a plan that includes Pages for
#      private repositories.
#   2. Settings → Pages → Source → GitHub Actions.
#
# `configure-pages` can normally switch Pages on by itself, but only when the
# workflow token carries the `pages: write` scope. A token without it fails
# with "Create Pages site failed — Resource not accessible by integration",
# which is why step 2 above may need doing by hand once.
#
# Manual trigger only, so the run does not fail repeatedly on every push
# before Pages has been set up. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Self-host the MediaPipe runtime and pose model
        # Ships the app with no third-party requests at all, so it works
        # offline from the very first launch.
        run: node scripts/fetch-vendor.mjs

      - name: Verify the pose maths
        run: npm test

      - name: Stage the static site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll \
                styles js icons vendor README.md _site/
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
